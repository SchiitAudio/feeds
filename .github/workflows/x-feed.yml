name: Update X feed

# Copies the XProductFeed Google Sheet (published TSV) into x-feed.tsv every night,
# before X's 1:00 AM Central fetch. X reads https://schiitaudio.github.io/feeds/x-feed.tsv
# Lisa edits the sheet as usual; nothing to do here.

on:
  schedule:
    - cron: '15 4 * * *'   # about 11:15 PM CDT / 10:15 PM CST
    - cron: '15 5 * * *'   # second try about an hour later
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published sheet
        run: |
          curl -sSfL --retry 5 --retry-delay 30 -o new.tsv "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXqYcGcYcmSzDXHtaXufzKgw4F3y4lpm3_60rGTTmJoFO9vNjljLUk6tyJ_yjwaJJwH3f_GUNHNns-/pub?output=tsv"
          lines=$(wc -l < new.tsv)
          echo "Downloaded $lines lines"
          head -1 new.tsv | cut -f1 | tr -d '\r' | grep -qx 'id' || { echo 'Header does not start with id - refusing to publish'; exit 1; }
          [ "$lines" -ge 50 ] || { echo "Only $lines lines - refusing to publish"; exit 1; }
          mv new.tsv x-feed.tsv
          date -u +'%Y-%m-%dT%H:%M:%SZ' > last-run.txt
      - name: Commit
        run: |
          git config user.name 'feed-bot'
          git config user.email 'feed-bot@users.noreply.github.com'
          git add x-feed.tsv last-run.txt
          git diff --cached --quiet || { git commit -m "Update X feed $(date -u +%F)"; git push; }
